# Managed by Commit Aquarium
name: Refresh aquarium image
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aquarium-profile
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Update image cache version
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          owner = os.environ['OWNER_NAME']
          api = f'https://api.github.com/repos/{owner}/commit-aquarium/contents/aquarium/aquarium.gif'
          req = urllib.request.Request(api, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'commit-aquarium'})
          with urllib.request.urlopen(req, timeout=30) as response:
              version = json.load(response)['sha'][:12]
          base = f'https://raw.githubusercontent.com/{owner}/commit-aquarium/main/aquarium/aquarium.gif'
          path = Path('README.md')
          text = path.read_text()
          if base not in text:
              raise SystemExit('Aquarium image link is missing from README.md')
          text = re.sub(re.escape(base) + r'(?:\?[^"\s)>]*)?', base + '?v=' + version, text)
          path.write_text(text)
          PY
      - name: Save profile
        env:
          OWNER_NAME: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git config user.name "$OWNER_NAME"
          git config user.email "${OWNER_ID}+${OWNER_NAME}@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh aquarium image [skip ci]'
            git push
          fi
